[profile.default]
src = "src"
out = "./vite-frontend/out"
libs = ["lib"]

ffi=true
fs_permissions = [
  { access = "read-write", path = "./frontend/out" },
  { access = "read-write", path = "./vite-frontend/out" }
]

remapppings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
